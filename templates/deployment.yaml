{{- if not .Values.persistence.data }}
{{- fail "persistence.data needs at least one mount" }}
{{- end }}
{{- range .Values.persistence.data }}
{{- if not .name }}
{{- fail "each persistence.data mount needs a name" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mylar3.labels" . | nindent 4 }}
spec:
  # Two copies of Mylar3 can't share one SQLite database, so the old pod stops before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mylar3.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mylar3.podLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      # No runAsUser: the image starts as root to chown /config, then drops to PUID and PGID.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mylar3
          image: "lscr.io/linuxserver/mylar3:{{ .Values.image.tag | default .Chart.AppVersion }}"
          env:
            - name: PUID
              value: {{ .Values.puid | quote }}
            - name: PGID
              value: {{ .Values.pgid | quote }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
          ports:
            - name: http
              containerPort: 8090
          # Mylar3 has no health endpoint that works without a login, so the probes check its port.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            {{- range .Values.persistence.data }}
            - name: data-{{ .name }}
              mountPath: /data/{{ .name }}
            {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "mylar3.claimName" (list . .Values.persistence.config "config") }}
        {{- range .Values.persistence.data }}
        - name: data-{{ .name }}
          persistentVolumeClaim:
            claimName: {{ include "mylar3.claimName" (list $ . (printf "data-%s" .name)) }}
        {{- end }}
